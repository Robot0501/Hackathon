<!doctype html>
<html>
  <body style="font-family:Arial,sans-serif;background:#f8fafc;padding:24px;color:#0f172a">
    <div style="max-width:520px;margin:auto;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:24px">
      <h2 style="margin:0 0 12px;color:#1e3a8a">Enrich verification code</h2>
      <p style="margin:0 0 16px">Use this one-time code to verify your email and continue to the Richfield Enrich platform.</p>
      <div style="font-size:32px;font-weight:700;letter-spacing:8px;text-align:center;padding:18px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;color:#1e3a8a">
        {{ .Token }}
      </div>
      <p style="font-size:12px;color:#64748b;margin-top:18px">If you did not request this code, you can ignore this email.</p>
    </div>
  </body>
</html>
